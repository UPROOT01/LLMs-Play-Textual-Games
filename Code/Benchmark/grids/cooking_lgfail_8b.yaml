# Cooking, Qwen3-8B: the lgfail result of cooking_fail.yaml on new seeds (THESIS_LOG.md 2026-11-13).
# On seeds 1-10 lgfail (think when the game refused the last command, keep the last reasoning) scored 0.493 with
# 3.3k thinking tokens per game; grand25 0.485 with 11.7k; lr4 0.579 with 9.2k; e1 0.545 with 43.5k. One model and
# 50 games: the difference in tokens is large, the equality of the scores is not established.
#   lgfail    the mode to confirm
#   grand25   the random gate it equalled, at 3.5 times its tokens
#   lr4       the best cheap mode of the 8B so far (played with the prompt CoT on seeds 1-10; here CoT+nonempty, which
#             for the 8B changes 2-5% of the reasonings)
# Seeds 11-30, so nothing is played twice; with seeds 1-10 the comparison lgfail / grand25 has 150 games per mode.
# What to read: lgfail - grand25 and lgfail - lr4 in score (paired by level and seed) and the thinking tokens.
# The claim holds if lgfail stays within a few points of grand25 with about a third of its tokens.
# 300 games: 3 modes x 5 levels x 20 seeds. A textual-game grid: run.py / colab.ipynb / run_remote.py.
models:
  - Qwen/Qwen3-8B-FP8
modes: [lgfail, grand25, lr4]
prompts: [CoT+nonempty]
games:
  cooking: [1, 3, 5, 7, 9]
seeds: 11-30
max_steps: 100
loop_window: 20
loop_max_distinct: 2
