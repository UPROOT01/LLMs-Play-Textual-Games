# Tier 1: the core comparison, on every model.
# Does thinking help (0 vs the others)? Is keeping the reasonings worse than throwing them away (r4 vs er4)?
# How much better is thinking at every turn, for how many more tokens (e1 vs er4)?
# Qwen3-4B only needs "0" with the CoT prompt: the other games are the old ones (experiments 7 and 7e).
models:
  - Qwen/Qwen3-1.7B
  - Qwen/Qwen3-8B
  - Qwen/Qwen3-4B
  - Qwen/Qwen3-0.6B
  - Qwen/Qwen3-14B-AWQ
modes: ["0", e1, r4, er4, lr4]
prompts: [CoT]
games:
  cooking: [1, 3, 5, 7, 9] # the game where the modes differ the most
seeds: 1-10
max_steps: 100
loop_window: 20 # stop the games stuck in a loop (as in experiments 7e and 8)
loop_max_distinct: 2
