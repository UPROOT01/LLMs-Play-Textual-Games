# Connect Four self-play: does remembering its own reasoning change how the model reasons about the opponent?
# Every pair of the thinking modes of the chess self-play (duel_selfplay.yaml), plus l1:
#   e1   thinks every turn, its reasonings leave the context (ephemeral);
#   l1   thinks every turn, its last reasoning stays in the context until the next one;
#   r4   thinks about every 4 turns, all its reasonings stay in the context;
#   er4  thinks about every 4 turns, none stays;
#   lr4  thinks about every 4 turns, only the last stays.
# In every mode the boards, the opponent's moves and the agent's answers stay in the context: only the agent's own
# reasonings are kept or dropped. e1 vs l1 changes only the memory (same thinking frequency); er4 / lr4 / r4 do the
# same at a lower frequency (none / last / all), so memory and frequency can be separated.
# "1" (keep every reasoning, think every turn) is left out: a Connect Four reasoning is ~2400 words, so after ~10
# moves the context exceeds the 40k tokens of the engine and the answers are replaced by illegal ones.
# 100 games: 5 modes x 5 opponents x plain and free (the two prompts with most opponent guesses) x seeds 1-2 (each
# pair once as X, once as O). The e1/r4 pairs repeat games of duel_c4_prompts.yaml.
models:
  - Qwen/Qwen3-4B
modes: [e1, l1, r4, er4, lr4]
prompts: [plain, free]
games:
  connect_four: [self-e1, self-l1, self-r4, self-er4, self-lr4]
seeds: 1-2
max_steps: 30
max_illegal: 3
illegal_policy: random
colors: alternate
game_options:
  connect_four: {legal_moves: true}
