# Connect Four: does the way the board is written change what thinking can repair? (board: both)
# In the gate grid the oracle gate (goracle) thinks exactly on the moves where the fast answer is a blunder, and the
# thinking repairs only about half of them; from ply 7 on every mode blunders 70-80% of the critical moves it thinks
# about. The reasonings often misread the row grid (a disc of column 4 read as column 3). Here the same games are
# played with another board text (duel_games.ConnectFour, option board):
#   columns  one line per column, its discs from the bottom up ("column 4: O O X X"): nothing to count across rows.
#   both     the row grid and then the columns.
# Baseline: the same modes, prompt, opponents and seeds of duel_c4_gate.yaml (board: grid), already played.
# What to read: the blunder rate of the thought moves (goracle: the repair rate of the fast blunders), the blunder
# rate of the fast moves (does the format help without thinking too?), the tokens per thinking turn.
# In self-e1 the opponent reads the same board text as the agent.
# IMPORTANT: the path of a record does not contain the game options, so these games need a results folder of their
# own (e.g. results_board_both): in the folder of the gate grid they would look already played (same seeds on purpose:
# nothing is overwritten, the run just finds 0 games to play).
# 90 games: 3 modes x 2 opponents x 15 seeds.
models:
  - Qwen/Qwen3-4B
modes: [goracle, e1, r4]
prompts: [plain]
games:
  connect_four: [greedy, self-e1]
seeds: 1-15
max_steps: 30
max_illegal: 3
illegal_policy: random
colors: alternate
shadow_fast_move: true
solver: true
game_options:
  connect_four: {legal_moves: true, board: both}
