# Cooking: a gate that thinks when the game refused the last command (gfail). The textual twin of gtactic.
# In the cooking games played so far (er4 and lr4, THESIS_LOG.md 2026-11-11) a thinking turn scores more often than a
# normal one mostly after a refused command: 8B 16.1% against 6.6% (2.4 times), 4B 6.3% against 2.0%; after an
# accepted command 9.9% against 7.5% (8B) and 9.4% against 7.3% (4B, p=0.11). The game says when a command is refused
# ("That's not a verb I recognise", "You can't see any such thing"...: gate.REJECTED), so no model is needed to know.
#   gfail      thinks when the last command was refused; drops the reasoning (like e1)
#   lgfail     the same, keeping the last reasoning until the next one (like l1)
#   grand25    thinks on 25% of the turns at random   | the controls for "how often": gfail's own rate depends on the
#   grand50    thinks on 50% of the turns at random   | model (refused commands: about 37% of the turns of the 8B,
#                                                       63% of the 4B, 75% of the 1.7B when it thinks every 4 turns)
# The rate of gfail is not fixed in advance: it is what the model's own failures make it (an adaptive n-think).
# Prompt CoT+nonempty: an empty reasoning is generated again, so every thinking turn of the gates has a reasoning.
# Baselines already played, same levels and seeds: 0 and e1 (CoT), er4 / lr4 / r4 (CoT+nonempty for the 1.7B and the
# 4B, CoT for the 8B, whose reasonings are empty 2-5% of the time).
# What to read: score against thinking tokens per game. Is gfail above the line of the random gates and of er4 at
# its cost, and how close to e1? The record has tokens.selfevaluations: the thinking turns of the game.
# 600 games: 3 models x 4 modes x 5 levels x 10 seeds. A textual-game grid: run.py / colab.ipynb / run_remote.py.
models:
  - Qwen/Qwen3-1.7B
  - Qwen/Qwen3-4B
  - Qwen/Qwen3-8B-FP8
modes: [gfail, lgfail, grand25, grand50]
prompts: [CoT+nonempty]
games:
  cooking: [1, 3, 5, 7, 9]
seeds: 1-10
max_steps: 100
loop_window: 20
loop_max_distinct: 2
